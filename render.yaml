# Render Blueprint for the Drift API (NestJS). Deploy with:
#   Render Dashboard -> New -> Blueprint -> select this repo.
# Render reads this file and provisions the service below, prompting you
# only for the envVars marked `sync: false`. See /DEPLOY.md for exactly
# which values to paste in and where to get them from Supabase.
#
# Free-tier notes:
# - The free plan spins the service down after ~15 minutes of inactivity;
#   the next request wakes it back up, which takes a few extra seconds.
# - preDeployCommand (for running migrations separately from the build)
#   is a paid-plan feature, so `prisma migrate deploy` runs as part of
#   buildCommand instead — safe to run on every deploy, it's a no-op when
#   there's nothing new to migrate.
services:
  - type: web
    name: drift-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    # Runs the compiled output directly rather than through `npm run
    # start:prod` — npm spawns Node as a *child* process, and Render's
    # automatic port detection only reliably watches the process it
    # directly started, not its grandchildren. That's what was causing the
    # ~15-20 minute "Timed Out" on every deploy even though the app itself
    # was already up and serving requests the whole time.
    startCommand: node dist/main
    # No healthCheckPath: every deploy sat "waiting for health check" for
    # ~15-20 minutes before a restart finally cleared it. Root cause turned
    # out to be simple once the service was reachable at all — `GET /`
    # requires auth in this app (a global guard, opt out per-route with
    # @Public()), so Render's unauthenticated health check was always going
    # to get a 401, never the 2xx it was waiting for. Falling back to
    # Render's plain port-detection (no HTTP check) sidesteps that. Could
    # revisit with a dedicated @Public() /health route if real uptime
    # monitoring (not just "is the port open") becomes worth the extra
    # endpoint.
    autoDeployTrigger: commit
    envVars:
      # Pins the Node version to match local development (api/.env.example
      # and the rest of the repo assume this). Render defaults to whatever
      # its current newest LTS is otherwise, which drifts over time.
      - key: NODE_VERSION
        value: '22'
      # Pinned explicitly: on a brand-new service's very first boot, Render's
      # auto-assigned PORT can arrive a beat too late for the app to pick it
      # up, so it falls back to 3000 while Render's health check is watching
      # its own default (10000) — a one-time "Timed Out" + auto-restart.
      # Setting it ourselves removes that race entirely.
      - key: PORT
        value: '10000'
      # Supabase project's Postgres connection string (Project Settings ->
      # Database -> Connection string -> URI), NOT the local dev one from
      # api/.env.example.
      - key: DATABASE_URL
        sync: false
      # Supabase project settings (Project Settings -> API).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      # The admin portal's deployed Vercel URL, once you have it (e.g.
      # https://drift-admin.vercel.app) — this is what lets the browser-based
      # admin portal call this API at all. Leave unset to start; add it
      # after the Vercel deploy below and Render will redeploy with it.
      - key: CORS_ORIGINS
        sync: false
